name: Build Evolution Learning 6 APK

on:
  push:
    branches:
      - chatgpt/android-v6-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Reconstruct and migrate Evolution Learning source
        shell: bash
        run: |
          set -euo pipefail
          cat .chatgpt-build/evo.part00 \
              .chatgpt-build/evo.part01 \
              .chatgpt-build/evo.part02 \
              .chatgpt-build/evo.part03 \
              .chatgpt-build/evo.part04 > /tmp/evolution-dev2.b64
          base64 --decode /tmp/evolution-dev2.b64 > /tmp/evolution-dev2.zip
          unzip -t /tmp/evolution-dev2.zip
          rm -rf /tmp/evolution-src
          mkdir -p /tmp/evolution-src
          unzip -q /tmp/evolution-dev2.zip -d /tmp/evolution-src
          PROJECT=/tmp/evolution-src/EvolutionLearning-Android-v6-Dev2
          test -f "$PROJECT/settings.gradle.kts"

          # API 36 is the stable target required by this app.
          sed -i 's/compileSdk = 37/compileSdk = 36/g' "$PROJECT/app/build.gradle.kts"

          # AGP 9 has built-in Kotlin; the legacy kotlin-android plugin conflicts with it.
          sed -i '/id("org.jetbrains.kotlin.android") version/d' "$PROJECT/build.gradle.kts"
          sed -i '/id("org.jetbrains.kotlin.android")/d' "$PROJECT/app/build.gradle.kts"

          # Use the current KSP plugin with AGP 9 / built-in Kotlin.
          sed -i 's/id("com.google.devtools.ksp") version "2.3.9"/id("com.google.devtools.ksp") version "2.3.10"/' "$PROJECT/build.gradle.kts"

          # AGP 9 built-in Kotlin owns JVM compilation; remove the legacy Kotlin DSL block.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/evolution-src/EvolutionLearning-Android-v6-Dev2/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('''\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n''', '\n')
          p.write_text(s)
          PY

          echo '--- root build.gradle.kts ---'
          cat "$PROJECT/build.gradle.kts"
          echo '--- app build.gradle.kts (head) ---'
          sed -n '1,90p' "$PROJECT/app/build.gradle.kts"

      - name: Build debug APK
        working-directory: /tmp/evolution-src/EvolutionLearning-Android-v6-Dev2
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        working-directory: /tmp/evolution-src/EvolutionLearning-Android-v6-Dev2
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Evolution APK
        uses: actions/upload-artifact@v4
        with:
          name: Evolution-Learning-6.0-debug-apk
          path: |
            /tmp/evolution-src/EvolutionLearning-Android-v6-Dev2/app/build/outputs/apk/debug/app-debug.apk
            /tmp/evolution-src/EvolutionLearning-Android-v6-Dev2/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
