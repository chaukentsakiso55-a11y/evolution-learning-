name: Build Evolution Learning 6.0.1 V5 Visual Match APK

on:
  push:
    branches:
      - chatgpt/android-v6-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Reconstruct native app and apply V5 visual match
        shell: bash
        run: |
          set -euo pipefail
          cat .chatgpt-build/evo.part00 .chatgpt-build/evo.part01 .chatgpt-build/evo.part02 .chatgpt-build/evo.part03 .chatgpt-build/evo.part04 > /tmp/evo.b64
          base64 --decode /tmp/evo.b64 > /tmp/evo.zip
          unzip -t /tmp/evo.zip
          rm -rf /tmp/evolution-src && mkdir -p /tmp/evolution-src
          unzip -q /tmp/evo.zip -d /tmp/evolution-src
          PROJECT=/tmp/evolution-src/EvolutionLearning-Android-v6-Dev2
          test -f "$PROJECT/settings.gradle.kts"

          # Same Android/Gradle compatibility migration that produced the last successful APK.
          sed -i 's/compileSdk = 37/compileSdk = 36/g' "$PROJECT/app/build.gradle.kts"
          sed -i '/id("org.jetbrains.kotlin.android") version/d' "$PROJECT/build.gradle.kts"
          sed -i '/id("org.jetbrains.kotlin.android")/d' "$PROJECT/app/build.gradle.kts"
          sed -i 's/id("com.google.devtools.ksp") version "2.3.9"/id("com.google.devtools.ksp") version "2.3.10"/' "$PROJECT/build.gradle.kts"
          sed -i 's/compose-bom:2026.08.00/compose-bom:2025.06.00/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/core-ktx:1.17.0/core-ktx:1.16.0/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/activity-compose:1.13.0/activity-compose:1.10.1/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/navigation-compose:2.10.0/navigation-compose:2.9.0/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/lifecycle-runtime-compose:2.10.0/lifecycle-runtime-compose:2.9.1/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/lifecycle-viewmodel-compose:2.10.0/lifecycle-viewmodel-compose:2.9.1/' "$PROJECT/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/evolution-src/EvolutionLearning-Android-v6-Dev2')
          p = root / 'app/build.gradle.kts'
          p.write_text(p.read_text().replace('''\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n''', '\n'))

          replacements = [
              ('app/src/main/java/com/cyberpulse/evolutionlearning/focus/FocusService.kt',
               'FocusSessionEntity(snapshot.startedAt, endAt, completed = true)',
               'FocusSessionEntity(startedAt = snapshot.startedAt, endedAt = endAt, completed = true)'),
              ('app/src/main/java/com/cyberpulse/evolutionlearning/focus/FocusSessionManager.kt',
               'FocusSessionEntity(snapshot.startedAt, System.currentTimeMillis(), completed = false)',
               'FocusSessionEntity(startedAt = snapshot.startedAt, endedAt = System.currentTimeMillis(), completed = false)'),
          ]
          for rel, old, new in replacements:
              f = root / rel
              text = f.read_text()
              if old in text:
                  f.write_text(text.replace(old, new))

          f = root / 'app/src/main/java/com/cyberpulse/evolutionlearning/ui/screens/FocusScreen.kt'
          text = f.read_text()
          text = text.replace(
              'Button(Modifier.fillMaxWidth(), enabled = blockerEnabled && selected.isNotEmpty(), onClick = { scope.launch { FocusSessionManager.start(context, minutes, selected); onBack() } })',
              'Button(onClick = { scope.launch { FocusSessionManager.start(context, minutes, selected); onBack() } }, modifier = Modifier.fillMaxWidth(), enabled = blockerEnabled && selected.isNotEmpty())')
          text = text.replace(
              'private fun ActiveFocusSession(snapshot: FocusSnapshot, attempts: List<com.cyberpulse.evolutionlearning.data.local.BlockedAttemptEntity>, hasPin: Boolean, onEnd: () -> Unit)',
              'private fun ColumnScope.ActiveFocusSession(snapshot: FocusSnapshot, attempts: List<com.cyberpulse.evolutionlearning.data.local.BlockedAttemptEntity>, hasPin: Boolean, onEnd: () -> Unit)')
          text = text.replace('OutlinedButton(onClick = onEnd, Modifier.fillMaxWidth())', 'OutlinedButton(onClick = onEnd, modifier = Modifier.fillMaxWidth())')
          f.write_text(text)

          f = root / 'app/src/main/java/com/cyberpulse/evolutionlearning/ui/screens/StudyScreen.kt'
          text = f.read_text()
          text = text.replace('@Composable private fun HomeworkSection(', '@Composable private fun ColumnScope.HomeworkSection(')
          text = text.replace('@Composable private fun NotesSection(', '@Composable private fun ColumnScope.NotesSection(')
          text = text.replace('@Composable private fun FlashcardSection(', '@Composable private fun ColumnScope.FlashcardSection(')
          f.write_text(text)
          PY

          # Wire Evolution AI to the same generated Google key resource used by the earlier Embedded-Gemini build.
          cat > "$PROJECT/app/src/main/java/com/cyberpulse/evolutionlearning/ai/CloudLlmProvider.kt" <<'KOTLIN'
          package com.cyberpulse.evolutionlearning.ai

          import android.content.Context
          import com.cyberpulse.evolutionlearning.R
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class CloudLlmProvider(context: Context) : LlmProvider {
              private val appContext = context.applicationContext
              private val apiKey: String by lazy {
                  runCatching { appContext.getString(R.string.google_api_key).trim() }.getOrDefault("")
              }

              override fun isAvailable(): Boolean = apiKey.startsWith("AIza") && apiKey.length >= 30

              override suspend fun complete(request: LlmRequest): Result<String> = withContext(Dispatchers.IO) {
                  if (!isAvailable()) return@withContext Result.failure(IllegalStateException("Evolution Gemini key is unavailable"))
                  runCatching {
                      val endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent"
                      val connection = (URL(endpoint).openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          connectTimeout = 20_000
                          readTimeout = 60_000
                          doOutput = true
                          setRequestProperty("Content-Type", "application/json")
                          setRequestProperty("x-goog-api-key", apiKey)
                      }
                      val prompt = buildString {
                          appendLine("You are Evolution AI, a supportive school learning tutor.")
                          appendLine("Mode: ${request.mode.name}")
                          appendLine("Student grade: ${request.context.grade.ifBlank { "Not set" }}")
                          if (request.context.subjects.isNotEmpty()) appendLine("Subjects: ${request.context.subjects.joinToString()}")
                          if (request.context.weakTopics.isNotEmpty()) appendLine("Weak topics: ${request.context.weakTopics.joinToString()}")
                          if (request.context.recentMistakes.isNotEmpty()) appendLine("Recent mistakes: ${request.context.recentMistakes.joinToString()}")
                          appendLine("Give a clear, age-appropriate educational answer and follow the selected learning mode.")
                          append("Student: ${request.message}")
                      }
                      val payload = JSONObject().apply {
                          put("contents", JSONArray().put(JSONObject().apply {
                              put("role", "user")
                              put("parts", JSONArray().put(JSONObject().put("text", prompt)))
                          }))
                          put("generationConfig", JSONObject().apply {
                              put("temperature", 0.4)
                              put("topP", 0.95)
                              put("maxOutputTokens", 1400)
                          })
                      }
                      connection.outputStream.use { it.write(payload.toString().toByteArray(Charsets.UTF_8)) }
                      val code = connection.responseCode
                      val stream = if (code in 200..299) connection.inputStream else connection.errorStream
                      val body = stream?.bufferedReader()?.use { it.readText() }.orEmpty()
                      if (code !in 200..299) {
                          val message = runCatching { JSONObject(body).optJSONObject("error")?.optString("message") }.getOrNull().orEmpty()
                          error(if (message.isBlank()) "Gemini HTTP $code" else message)
                      }
                      val candidates = JSONObject(body).optJSONArray("candidates") ?: error("Gemini returned no candidates")
                      buildString {
                          for (i in 0 until candidates.length()) {
                              val parts = candidates.optJSONObject(i)?.optJSONObject("content")?.optJSONArray("parts") ?: continue
                              for (j in 0 until parts.length()) {
                                  val value = parts.optJSONObject(j)?.optString("text").orEmpty()
                                  if (value.isNotBlank()) { if (isNotEmpty()) append('\n'); append(value) }
                              }
                          }
                      }.trim().ifBlank { error("Gemini returned an empty response") }
                  }
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/evolution-src/EvolutionLearning-Android-v6-Dev2/app/src/main/java/com/cyberpulse/evolutionlearning/ai/AiViewModel.kt')
          p.write_text(p.read_text().replace('LlmRouter(CloudLlmProvider(), LocalLlmProvider())', 'LlmRouter(CloudLlmProvider(app), LocalLlmProvider())'))
          PY

          # Apply the Compose presentation layer recreated from the uploaded v5 no-passwords design.
          cat .chatgpt-build/uiov.part0 .chatgpt-build/uiov.part1 > /tmp/uiov.b64
          base64 --decode /tmp/uiov.b64 > /tmp/uiov.zip
          unzip -t /tmp/uiov.zip
          unzip -oq /tmp/uiov.zip -d "$PROJECT"

          sed -i 's/versionCode = 62/versionCode = 64/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/versionName = "6.0.0-dev2"/versionName = "6.0.1-v5-visual-match"/' "$PROJECT/app/build.gradle.kts"

          grep -q 'R.string.google_api_key' "$PROJECT/app/src/main/java/com/cyberpulse/evolutionlearning/ai/CloudLlmProvider.kt"
          grep -q 'EvoCyan' "$PROJECT/app/src/main/java/com/cyberpulse/evolutionlearning/ui/screens/Common.kt"
          grep -q 'Learn, Track, Grow' "$PROJECT/app/src/main/java/com/cyberpulse/evolutionlearning/ui/screens/HomeScreen.kt"

      - name: Build V5 visual-match APK
        id: build
        continue-on-error: true
        working-directory: /tmp/evolution-src/EvolutionLearning-Android-v6-Dev2
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/evolution-build.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Evolution-Learning-6.0.1-V5-Visual-Match-build-log
          path: /tmp/evolution-build.log
          if-no-files-found: warn
          retention-days: 2

      - name: Verify APK
        if: steps.build.outcome == 'success'
        working-directory: /tmp/evolution-src/EvolutionLearning-Android-v6-Dev2
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          unzip -p app/build/outputs/apk/debug/app-debug.apk classes*.dex | strings | grep -q 'gemini-3.7-flash'
          unzip -p app/build/outputs/apk/debug/app-debug.apk classes*.dex | strings | grep -q 'x-goog-api-key'
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V5 visual-match APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Evolution-Learning-6.0.1-V5-Visual-Match-APK
          path: |
            /tmp/evolution-src/EvolutionLearning-Android-v6-Dev2/app/build/outputs/apk/debug/app-debug.apk
            /tmp/evolution-src/EvolutionLearning-Android-v6-Dev2/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Fail workflow on compiler error
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          tail -n 240 /tmp/evolution-build.log || true
          exit 1
