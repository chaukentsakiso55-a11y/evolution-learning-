name: Build Evolution Learning 6.0.1 V5 Visual Match APK

on:
  push:
    branches: [chatgpt/android-v6-apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Reconstruct app, wire Gemini, apply V5 UI
        shell: bash
        run: |
          set -euo pipefail
          cat .chatgpt-build/evo.part00 .chatgpt-build/evo.part01 .chatgpt-build/evo.part02 .chatgpt-build/evo.part03 .chatgpt-build/evo.part04 > /tmp/evo.b64
          base64 --decode /tmp/evo.b64 > /tmp/evo.zip
          unzip -t /tmp/evo.zip
          rm -rf /tmp/evolution-src && mkdir -p /tmp/evolution-src
          unzip -q /tmp/evo.zip -d /tmp/evolution-src
          PROJECT=/tmp/evolution-src/EvolutionLearning-Android-v6-Dev2

          sed -i 's/compileSdk = 37/compileSdk = 36/g' "$PROJECT/app/build.gradle.kts"
          sed -i '/id("org.jetbrains.kotlin.android") version/d' "$PROJECT/build.gradle.kts"
          sed -i '/id("org.jetbrains.kotlin.android")/d' "$PROJECT/app/build.gradle.kts"
          sed -i 's/id("com.google.devtools.ksp") version "2.3.9"/id("com.google.devtools.ksp") version "2.3.10"/' "$PROJECT/build.gradle.kts"
          sed -i 's/compose-bom:2026.08.00/compose-bom:2025.06.00/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/core-ktx:1.17.0/core-ktx:1.16.0/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/activity-compose:1.13.0/activity-compose:1.10.1/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/navigation-compose:2.10.0/navigation-compose:2.9.0/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/lifecycle-runtime-compose:2.10.0/lifecycle-runtime-compose:2.9.1/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/lifecycle-viewmodel-compose:2.10.0/lifecycle-viewmodel-compose:2.9.1/' "$PROJECT/app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/evolution-src/EvolutionLearning-Android-v6-Dev2')
          p=root/'app/build.gradle.kts'
          p.write_text(p.read_text().replace('\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n','\n'))
          fixes=[
            ('app/src/main/java/com/cyberpulse/evolutionlearning/focus/FocusService.kt','FocusSessionEntity(snapshot.startedAt, endAt, completed = true)','FocusSessionEntity(startedAt = snapshot.startedAt, endedAt = endAt, completed = true)'),
            ('app/src/main/java/com/cyberpulse/evolutionlearning/focus/FocusSessionManager.kt','FocusSessionEntity(snapshot.startedAt, System.currentTimeMillis(), completed = false)','FocusSessionEntity(startedAt = snapshot.startedAt, endedAt = System.currentTimeMillis(), completed = false)')]
          for rel,a,b in fixes:
            f=root/rel; s=f.read_text(); f.write_text(s.replace(a,b))
          f=root/'app/src/main/java/com/cyberpulse/evolutionlearning/ui/screens/FocusScreen.kt'
          s=f.read_text().replace('Button(Modifier.fillMaxWidth(), enabled = blockerEnabled && selected.isNotEmpty(), onClick = { scope.launch { FocusSessionManager.start(context, minutes, selected); onBack() } })','Button(onClick = { scope.launch { FocusSessionManager.start(context, minutes, selected); onBack() } }, modifier = Modifier.fillMaxWidth(), enabled = blockerEnabled && selected.isNotEmpty())').replace('private fun ActiveFocusSession(snapshot: FocusSnapshot, attempts: List<com.cyberpulse.evolutionlearning.data.local.BlockedAttemptEntity>, hasPin: Boolean, onEnd: () -> Unit)','private fun ColumnScope.ActiveFocusSession(snapshot: FocusSnapshot, attempts: List<com.cyberpulse.evolutionlearning.data.local.BlockedAttemptEntity>, hasPin: Boolean, onEnd: () -> Unit)').replace('OutlinedButton(onClick = onEnd, Modifier.fillMaxWidth())','OutlinedButton(onClick = onEnd, modifier = Modifier.fillMaxWidth())')
          f.write_text(s)
          f=root/'app/src/main/java/com/cyberpulse/evolutionlearning/ui/screens/StudyScreen.kt'
          s=f.read_text().replace('@Composable private fun HomeworkSection(','@Composable private fun ColumnScope.HomeworkSection(').replace('@Composable private fun NotesSection(','@Composable private fun ColumnScope.NotesSection(').replace('@Composable private fun FlashcardSection(','@Composable private fun ColumnScope.FlashcardSection(')
          f.write_text(s)
          PY

          cat > "$PROJECT/app/src/main/java/com/cyberpulse/evolutionlearning/ai/CloudLlmProvider.kt" <<'KOTLIN'
          package com.cyberpulse.evolutionlearning.ai
          import android.content.Context
          import com.cyberpulse.evolutionlearning.R
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class CloudLlmProvider(context: Context) : LlmProvider {
              private val appContext=context.applicationContext
              private val apiKey:String by lazy { runCatching { appContext.getString(R.string.google_api_key).trim() }.getOrDefault("") }
              override fun isAvailable()=apiKey.startsWith("AIza") && apiKey.length>=30
              override suspend fun complete(request:LlmRequest):Result<String> = withContext(Dispatchers.IO) {
                  if(!isAvailable()) return@withContext Result.failure(IllegalStateException("Evolution Gemini key is unavailable"))
                  runCatching {
                      val c=(URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent").openConnection() as HttpURLConnection).apply {
                          requestMethod="POST"; connectTimeout=20000; readTimeout=60000; doOutput=true
                          setRequestProperty("Content-Type","application/json"); setRequestProperty("x-goog-api-key",apiKey)
                      }
                      val prompt=buildString {
                          appendLine("You are Evolution AI, a supportive school learning tutor.")
                          appendLine("Mode: ${request.mode.name}"); appendLine("Student grade: ${request.context.grade.ifBlank { "Not set" }}")
                          if(request.context.subjects.isNotEmpty()) appendLine("Subjects: ${request.context.subjects.joinToString()}")
                          if(request.context.weakTopics.isNotEmpty()) appendLine("Weak topics: ${request.context.weakTopics.joinToString()}")
                          if(request.context.recentMistakes.isNotEmpty()) appendLine("Recent mistakes: ${request.context.recentMistakes.joinToString()}")
                          appendLine("Give a clear, age-appropriate educational answer and follow the selected learning mode.")
                          append("Student: ${request.message}")
                      }
                      val body=JSONObject().apply {
                          put("contents",JSONArray().put(JSONObject().apply { put("role","user"); put("parts",JSONArray().put(JSONObject().put("text",prompt))) }))
                          put("generationConfig",JSONObject().apply { put("temperature",0.4); put("topP",0.95); put("maxOutputTokens",1400) })
                      }.toString()
                      c.outputStream.use { it.write(body.toByteArray()) }
                      val code=c.responseCode; val raw=(if(code in 200..299)c.inputStream else c.errorStream)?.bufferedReader()?.use { it.readText() }.orEmpty()
                      if(code !in 200..299) error(runCatching { JSONObject(raw).optJSONObject("error")?.optString("message") }.getOrNull().orEmpty().ifBlank { "Gemini HTTP $code" })
                      val candidates=JSONObject(raw).optJSONArray("candidates") ?: error("Gemini returned no candidates")
                      buildString {
                          for(i in 0 until candidates.length()) {
                              val parts=candidates.optJSONObject(i)?.optJSONObject("content")?.optJSONArray("parts") ?: continue
                              for(j in 0 until parts.length()) { val t=parts.optJSONObject(j)?.optString("text").orEmpty(); if(t.isNotBlank()) { if(isNotEmpty()) append('\n'); append(t) } }
                          }
                      }.trim().ifBlank { error("Gemini returned an empty response") }
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/evolution-src/EvolutionLearning-Android-v6-Dev2/app/src/main/java/com/cyberpulse/evolutionlearning/ai/AiViewModel.kt')
          p.write_text(p.read_text().replace('LlmRouter(CloudLlmProvider(), LocalLlmProvider())','LlmRouter(CloudLlmProvider(app), LocalLlmProvider())'))
          PY

          cat .chatgpt-build/uiov.part0 .chatgpt-build/uiov.part1 > /tmp/uiov.b64
          base64 --decode /tmp/uiov.b64 > /tmp/uiov.zip
          unzip -t /tmp/uiov.zip
          unzip -oq /tmp/uiov.zip -d "$PROJECT"

          # Fix the only compile issue found in the first V5 visual-match pass.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/evolution-src/EvolutionLearning-Android-v6-Dev2/app/src/main/java/com/cyberpulse/evolutionlearning/ui/EvolutionApp.kt')
          s=p.read_text()
          if 'import androidx.compose.material3.Text\n' not in s:
              s=s.replace('import androidx.compose.material3.Scaffold\n','import androidx.compose.material3.Scaffold\nimport androidx.compose.material3.Text\n')
          p.write_text(s)
          PY

          sed -i 's/versionCode = 62/versionCode = 64/' "$PROJECT/app/build.gradle.kts"
          sed -i 's/versionName = "6.0.0-dev2"/versionName = "6.0.1-v5-visual-match"/' "$PROJECT/app/build.gradle.kts"
          grep -q 'import androidx.compose.material3.Text' "$PROJECT/app/src/main/java/com/cyberpulse/evolutionlearning/ui/EvolutionApp.kt"
          grep -q 'Learn, Track, Grow' "$PROJECT/app/src/main/java/com/cyberpulse/evolutionlearning/ui/screens/HomeScreen.kt"
          grep -q 'R.string.google_api_key' "$PROJECT/app/src/main/java/com/cyberpulse/evolutionlearning/ai/CloudLlmProvider.kt"

      - name: Build APK
        id: build
        continue-on-error: true
        working-directory: /tmp/evolution-src/EvolutionLearning-Android-v6-Dev2
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/evolution-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Evolution-Learning-6.0.1-V5-Visual-Match-build-log
          path: /tmp/evolution-build.log
          retention-days: 2

      - name: Verify APK and Gemini wiring
        if: steps.build.outcome == 'success'
        working-directory: /tmp/evolution-src/EvolutionLearning-Android-v6-Dev2
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          unzip -p app/build/outputs/apk/debug/app-debug.apk classes*.dex | strings | grep -q 'gemini-3.7-flash'
          unzip -p app/build/outputs/apk/debug/app-debug.apk classes*.dex | strings | grep -q 'x-goog-api-key'

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Evolution-Learning-6.0.1-V5-Visual-Match-APK
          path: |
            /tmp/evolution-src/EvolutionLearning-Android-v6-Dev2/app/build/outputs/apk/debug/app-debug.apk
            /tmp/evolution-src/EvolutionLearning-Android-v6-Dev2/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 7

      - name: Fail on compiler error
        if: steps.build.outcome == 'failure'
        run: |
          tail -n 240 /tmp/evolution-build.log || true
          exit 1
